          const item = localStorage.getItem("sajgoj_store_" + key);
          return item ? JSON.parse(item) : defaultVal;
        } catch(e) { return defaultVal; }
      };
      const setStored = (key, val) => {
        try { localStorage.setItem("sajgoj_store_" + key, JSON.stringify(val)); } catch(e) {}
      };

      // Main Reactive States
      const [products, setProducts] = useState(() => getStored("products", initialProducts));
      const [reviews, setReviews] = useState(() => getStored("reviews", initialReviews));
      const [categories, setCategories] = useState(() => getStored("categories", initialCategories));
      const [orders, setOrders] = useState(() => getStored("orders", initialOrders));
      const [coupons, setCoupons] = useState(() => getStored("coupons", initialCoupons));
      const [banners, setBanners] = useState(() => getStored("banners", initialBanners));
      const [config, setConfig] = useState(() => getStored("config", initialStoreConfig));
      const [courier, setCourier] = useState(() => getStored("courier", initialCourierConfig));
      const [pixel, setPixel] = useState(() => getStored("pixel", initialPixelConfig));
      const [seo, setSeo] = useState(() => getStored("seo", initialSeoConfig));

      // Persistent Local Storage Sync
      useEffect(() => setStored("products", products), [products]);
      useEffect(() => setStored("reviews", reviews), [reviews]);
      useEffect(() => setStored("categories", categories), [categories]);
      useEffect(() => setStored("orders", orders), [orders]);
      useEffect(() => setStored("coupons", coupons), [coupons]);
      useEffect(() => setStored("banners", banners), [banners]);
      useEffect(() => setStored("config", config), [config]);
      useEffect(() => setStored("courier", courier), [courier]);
      useEffect(() => setStored("pixel", pixel), [pixel]);
      useEffect(() => setStored("seo", seo), [seo]);

      // Firebase Firestore Cloud Sync Status & Helpers
      const [cloudSyncStatus, setCloudSyncStatus] = useState("connecting"); // "connected", "syncing", "offline"
      const [lastCloudSyncTime, setLastCloudSyncTime] = useState(new Date().toLocaleTimeString("bn-BD"));

      const syncDocToCloud = async (collectionName, docId, data) => {
        if (!firestoreDb) return;
        try {
          setCloudSyncStatus("syncing");
          await firestoreDb.collection(collectionName).doc(docId).set(data, { merge: true });
          setCloudSyncStatus("connected");
          setLastCloudSyncTime(new Date().toLocaleTimeString("bn-BD"));
        } catch(e) {
          console.error(`Cloud save error [${collectionName}/${docId}]:`, e);
          setCloudSyncStatus("offline");
        }
      };

      const deleteDocFromCloud = async (collectionName, docId) => {
        if (!firestoreDb) return;
        try {
          setCloudSyncStatus("syncing");
          await firestoreDb.collection(collectionName).doc(docId).delete();
          setCloudSyncStatus("connected");
          setLastCloudSyncTime(new Date().toLocaleTimeString("bn-BD"));
        } catch(e) {
          console.error(`Cloud delete error [${collectionName}/${docId}]:`, e);
          setCloudSyncStatus("offline");
        }
      };

      // Realtime Firestore Subscriptions
      useEffect(() => {
        if (!firestoreDb) {
          setCloudSyncStatus("offline");
          return;
        }

        let isMounted = true;
        setCloudSyncStatus("connecting");

        // 1. Products Subscription
        const unsubProducts = firestoreDb.collection("products").onSnapshot((snapshot) => {
          if (!isMounted) return;
          if (!snapshot.empty) {
            const list = [];
            snapshot.forEach(doc => list.push(doc.data()));
            setProducts(list);
            setStored("products", list);
            setCloudSyncStatus("connected");
            setLastCloudSyncTime(new Date().toLocaleTimeString("bn-BD"));
          } else {
            console.log("Seeding products to Firestore...");
            initialProducts.forEach(p => firestoreDb.collection("products").doc(p.id).set(p));
            setCloudSyncStatus("connected");
          }
        }, (err) => {
          console.warn("Firestore products sync error:", err);
          setCloudSyncStatus("offline");
        });

        // 2. Categories Subscription
        const unsubCategories = firestoreDb.collection("categories").onSnapshot((snapshot) => {
          if (!isMounted) return;
          if (!snapshot.empty) {
            const list = [];
            snapshot.forEach(doc => list.push(doc.data()));
            setCategories(list);
            setStored("categories", list);
          } else {
            initialCategories.forEach(c => firestoreDb.collection("categories").doc(c.id).set(c));
          }
        }, (err) => console.warn("Categories sync error:", err));

        // 3. Orders Subscription
        const unsubOrders = firestoreDb.collection("orders").onSnapshot((snapshot) => {
          if (!isMounted) return;
          if (!snapshot.empty) {
            const list = [];
            snapshot.forEach(doc => list.push(doc.data()));
            list.sort((a,b) => (b.date || "").localeCompare(a.date || "") || (b.id || "").localeCompare(a.id || ""));
            setOrders(list);
            setStored("orders", list);
          } else {
            initialOrders.forEach(o => firestoreDb.collection("orders").doc(o.id).set(o));
          }
        }, (err) => console.warn("Orders sync error:", err));

        // 4. Coupons Subscription
        const unsubCoupons = firestoreDb.collection("coupons").onSnapshot((snapshot) => {
          if (!isMounted) return;
          if (!snapshot.empty) {
            const list = [];
            snapshot.forEach(doc => list.push(doc.data()));
            setCoupons(list);
            setStored("coupons", list);
          } else {
            initialCoupons.forEach(c => firestoreDb.collection("coupons").doc(c.id).set(c));
          }
        }, (err) => console.warn("Coupons sync error:", err));

        // 5. Banners Subscription
        const unsubBanners = firestoreDb.collection("banners").onSnapshot((snapshot) => {
          if (!isMounted) return;
          if (!snapshot.empty) {
            const list = [];
            snapshot.forEach(doc => list.push(doc.data()));
            list.sort((a,b) => (a.order || 0) - (b.order || 0));
            setBanners(list);
            setStored("banners", list);
          } else {
            initialBanners.forEach(b => firestoreDb.collection("banners").doc(b.id).set(b));
          }
        }, (err) => console.warn("Banners sync error:", err));

        // 6. Configs Subscription
        const unsubStore = firestoreDb.collection("config").doc("store").onSnapshot((doc) => {
          if (!isMounted) return;
          if (doc.exists) {
            setConfig(doc.data());
            setStored("config", doc.data());
          } else {
            firestoreDb.collection("config").doc("store").set(initialStoreConfig);
          }
        }, (err) => console.warn("Config sync error:", err));

        const unsubCourier = firestoreDb.collection("config").doc("courier").onSnapshot((doc) => {
          if (!isMounted) return;
          if (doc.exists) {
            setCourier(doc.data());
            setStored("courier", doc.data());
          } else {
            firestoreDb.collection("config").doc("courier").set(initialCourierConfig);
          }
        }, (err) => console.warn("Courier sync error:", err));

        const unsubPixel = firestoreDb.collection("config").doc("pixel").onSnapshot((doc) => {
          if (!isMounted) return;
          if (doc.exists) {
            setPixel(doc.data());
            setStored("pixel", doc.data());
          } else {
            firestoreDb.collection("config").doc("pixel").set(initialPixelConfig);
          }
        }, (err) => console.warn("Pixel sync error:", err));

        const unsubSeo = firestoreDb.collection("config").doc("seo").onSnapshot((doc) => {
          if (!isMounted) return;
          if (doc.exists) {
            setSeo(doc.data());
            setStored("seo", doc.data());
          } else {
            firestoreDb.collection("config").doc("seo").set(initialSeoConfig);
          }
        }, (err) => console.warn("Seo sync error:", err));

        // 7. Reviews Subscription
        const unsubReviews = firestoreDb.collection("reviews").onSnapshot((snapshot) => {
          if (!isMounted) return;
          if (!snapshot.empty) {
            const list = [];
            snapshot.forEach(doc => list.push(doc.data()));
            list.sort((a,b) => (b.date || "").localeCompare(a.date || "") || (b.createdAt || 0) - (a.createdAt || 0));
            setReviews(list);
            setStored("reviews", list);
          } else {
            initialReviews.forEach(r => firestoreDb.collection("reviews").doc(r.id).set(r));
          }
        }, (err) => console.warn("Reviews sync error:", err));

        return () => {
          isMounted = false;
          unsubProducts();
          unsubCategories();
          unsubOrders();
          unsubCoupons();
          unsubBanners();
          unsubReviews();
          unsubStore();
          unsubCourier();
          unsubPixel();
          unsubSeo();
        };
      }, []);

      // Navigation & Toast State
      const [activeTab, setActiveTab] = useState("Storefront");
      const [isAdminDrawerOpen, setIsAdminDrawerOpen] = useState(false);
      const [toast, setToast] = useState(null);

      // Storefront & Cart State
      const [cart, setCart] = useState(() => getStored("cart", []));
      useEffect(() => setStored("cart", cart), [cart]);
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [isCheckoutOpen, setIsCheckoutOpen] = useState(false);
      const [storeSearch, setStoreSearch] = useState("");
      const [selectedCat, setSelectedCat] = useState("All");
      const [currentSlide, setCurrentSlide] = useState(0);
      const [viewProduct, setViewProduct] = useState(null);
      const [selectedDetailImg, setSelectedDetailImg] = useState(0);
      const [productQty, setProductQty] = useState(1);
      const [viewInvoiceOrder, setViewInvoiceOrder] = useState(null);

      // Review System State
      const [isReviewFormOpen, setIsReviewFormOpen] = useState(false);
      const [reviewRating, setReviewRating] = useState(5);
      const [reviewerName, setReviewerName] = useState("");
      const [reviewComment, setReviewComment] = useState("");
      const [isSubmittingReview, setIsSubmittingReview] = useState(false);

      // Reset review form when opened product changes
      useEffect(() => {
        setIsReviewFormOpen(false);
        setReviewRating(5);
        setReviewerName("");
        setReviewComment("");
      }, [viewProduct?.id]);

      const handleSubmitReview = async (e) => {
        if (e) e.preventDefault();
        if (!viewProduct) return;
        if (!reviewComment.trim()) {
          notify("অনুগ্রহ করে আপনার মূল্যবান রিভিউ বা মন্তব্যটি লিখুন!");
          return;
        }

        setIsSubmittingReview(true);
        const reviewDate = new Date().toISOString().split("T")[0];
        const newReview = {
          id: "rev-" + Date.now(),
          productId: viewProduct.id,
          customerName: reviewerName.trim() || "ভেরিফাইড ক্রেতা",
          rating: Number(reviewRating),
          comment: reviewComment.trim(),
          date: reviewDate,
          createdAt: Date.now(),
          verified: true
        };

        const updatedReviews = [newReview, ...reviews];
        setReviews(updatedReviews);
        setStored("reviews", updatedReviews);

        // Calculate updated rating & reviews count
        const productReviews = updatedReviews.filter(r => r.productId === viewProduct.id);
        const newCount = productReviews.length;
        const sumRating = productReviews.reduce((sum, r) => sum + (Number(r.rating) || 5), 0);
        const newAvg = parseFloat((sumRating / newCount).toFixed(1));

        const updatedProduct = {
          ...viewProduct,
          rating: newAvg,
          reviewsCount: newCount
        };

        setViewProduct(updatedProduct);
        setProducts(prev => prev.map(p => p.id === viewProduct.id ? updatedProduct : p));

        // Sync with Firestore Cloud
        await syncDocToCloud("reviews", newReview.id, newReview);
        await syncDocToCloud("products", viewProduct.id, updatedProduct);

        setIsSubmittingReview(false);
        setIsReviewFormOpen(false);
        setReviewerName("");
        setReviewComment("");
        setReviewRating(5);
        notify("ধন্যবাদ! আপনার রিভিউটি সফলভাবে যুক্ত হয়েছে! ⭐");
      };

      // Checkout form state
      const [checkoutForm, setCheckoutForm] = useState({
        name: "",
        phone: "",
        district: "Dhaka",
        thana: "",
        address: "",
        paymentMethod: "Cash on Delivery"
      });
      const [appliedCoupon, setAppliedCoupon] = useState(null);
      const [couponInput, setCouponInput] = useState("");

      // Admin Modals & Forms
      const [isProductModalOpen, setIsProductModalOpen] = useState(false);
      const [editingProduct, setEditingProduct] = useState(null);
      const [productForm, setProductForm] = useState({ 
        name: "", 
        price: 0, 
        stock: 5, 
        category: "শাড়ি", 
        images: [], 
        sku: "", 
        description: "",
        sourceUrl: ""
      });
      const [externalLinkInput, setExternalLinkInput] = useState("");
      const [imageUrlInput, setImageUrlInput] = useState("");
      const [isFetchingUrl, setIsFetchingUrl] = useState(false);
      const [imgLoadStatus, setImgLoadStatus] = useState("idle"); // idle, loaded, error

      const [newCategory, setNewCategory] = useState({ name: "", icon: "✨" });
      const [couponForm, setCouponForm] = useState({ code: "", type: "%", value: 10, minOrder: 1500, expiry: "2026-12-31", active: true });
      const [bannerForm, setBannerForm] = useState({ title: "", subtitle: "", buttonText: "কালেকশন দেখুন", link: "#products", image: "", active: true });
      const [editingBanner, setEditingBanner] = useState(null);
      const [isBannerModalOpen, setIsBannerModalOpen] = useState(false);

      const fileInputRef = useRef(null);
      const productImgFileRef = useRef(null);
      const logoFileRef = useRef(null);
      const faviconFileRef = useRef(null);
      const bannerImgFileRef = useRef(null);
      const bannerEditFileRef = useRef(null);

      const notify = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3500);
      };

      // Auto Carousel
      useEffect(() => {
        if (activeTab !== "Storefront") return;
        const activeBanners = banners.filter(b => b.active);
        if (activeBanners.length <= 1) return;
        const timer = setInterval(() => {
          setCurrentSlide(prev => (prev + 1) % activeBanners.length);
        }, 5000);
        return () => clearInterval(timer);
      }, [activeTab, banners]);

      // Smart External Product Link Fetcher
      const handleSmartFetch = async () => {
        const url = externalLinkInput.trim();
        if (!url) {
          notify("অনুগ্রহ করে অন্য ওয়েবসাইটের প্রোডাক্ট লিঙ্ক পেস্ট করুন!");
          return;
        }

        setIsFetchingUrl(true);
        setImgLoadStatus("idle");
        notify("ওয়েবসাইট থেকে প্রোডাক্টের ছবি ও তথ্য খোঁজা হচ্ছে... ⏳");

        // Check if user directly pasted an image URL
        const isDirectImage = /\.(jpeg|jpg|png|webp|gif|svg)($|\?)/i.test(url) || 
                              url.includes("alicdn.com") || 
                              url.includes("daraz.com.bd/image") || 
                              url.includes("m.media-amazon.com") ||
                              url.includes("images/");

        if (isDirectImage) {
          setImageUrlInput(url);
          setProductForm(prev => ({ 
            ...prev, 
            sourceUrl: url,
            images: [url, ...prev.images.filter(x => x !== url)]
          }));
          setIsFetchingUrl(false);
          setImgLoadStatus("loaded");
          notify("✓ ছবির সরাসরি লিঙ্ক সফলভাবে কানেক্ট হয়েছে!");
          return;
        }

        // Try extracting Open Graph metadata via public CORS proxy
        try {
          const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
          const response = await fetch(proxyUrl);
          if (!response.ok) throw new Error("Proxy error");
          const data = await response.json();
          const html = data.contents;

          if (html) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, "text/html");

            // Extract Title
            const ogTitle = doc.querySelector('meta[property="og:title"]')?.getAttribute('content') || 
                            doc.querySelector('title')?.innerText || "";
            // Extract Image
            let ogImage = doc.querySelector('meta[property="og:image"]')?.getAttribute('content') || 
                          doc.querySelector('meta[name="twitter:image"]')?.getAttribute('content') || "";
            // Extract Description
            const ogDesc = doc.querySelector('meta[property="og:description"]')?.getAttribute('content') || 
                           doc.querySelector('meta[name="description"]')?.getAttribute('content') || "";

            // Fallback image search inside page
            if (!ogImage) {
              const imgEls = Array.from(doc.querySelectorAll('img[src*="http"]'));
              const productImg = imgEls.find(i => i.src && !i.src.includes('logo') && !i.src.includes('icon'));
              if (productImg) ogImage = productImg.src;
            }

            const cleanTitle = ogTitle ? ogTitle.replace(/[-|].*$/, "").trim() : "";
            
            setProductForm(prev => ({
              ...prev,
              name: cleanTitle || prev.name || "নতুন ইমপোর্ট করা পণ্য",
              description: ogDesc ? ogDesc.trim() : prev.description,
              sourceUrl: url,
              images: ogImage ? [ogImage, ...prev.images.filter(x => x !== ogImage)] : prev.images
            }));

            if (ogImage) {
              setImageUrlInput(ogImage);
              setImgLoadStatus("loaded");
              notify("✨ অন্য ওয়েবসাইট থেকে প্রোডাক্টের ছবি ও টাইটেল অটো-ইমপোর্ট হয়েছে!");
            } else {
              notify("প্রোডাক্টের টাইটেল পাওয়া গেছে! নিচের বক্সে ছবির সরাসরি লিঙ্ক দিন।");
            }
          }
        } catch (err) {
          // If proxy fails or site restricts, set sourceUrl and prompt for direct image link
          setProductForm(prev => ({ ...prev, sourceUrl: url }));
          notify("ওয়েবসাইট থেকে সরাসরি ছবি ফেচ করা যায়নি। নিচের বক্সে ছবির লিঙ্ক (Image URL) দিন।");
        } finally {
          setIsFetchingUrl(false);
        }
      };

      // Add image to product's image list
      const addImageToGallery = (url) => {
        if (!url || !url.trim()) return;
        setProductForm(prev => ({
          ...prev,
          images: prev.images.includes(url) ? prev.images : [...prev.images, url]
        }));
        setImageUrlInput("");
        setImgLoadStatus("loaded");
        notify("গ্যালারিতে নতুন ছবি যুক্ত হয়েছে! 🖼️");
      };

      // Cart Functions
      const addToCart = (product, qty = 1) => {
        if (product.stock <= 0) {
          notify("দুঃখিত, এই পণ্যটি স্টক আউট!");
          return;
        }
        setCart(prev => {
          const existing = prev.find(item => item.id === product.id);
          if (existing) {
            return prev.map(item => item.id === product.id ? { ...item, qty: item.qty + qty } : item);
          }
          return [...prev, { ...product, qty }];
        });
        notify(`"${product.name}" কার্টে যুক্ত হয়েছে! 🛒`);
      };

      const updateCartQty = (id, delta) => {
        setCart(prev => prev.map(item => {
          if (item.id === id) {
            const newQty = item.qty + delta;
            return newQty > 0 ? { ...item, qty: newQty } : null;
          }
          return item;
        }).filter(Boolean));
      };

      const cartSubtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      const isDhaka = checkoutForm.district.includes("ঢাকা") || checkoutForm.district.includes("Dhaka");
      const freeThreshold = config.freeDeliveryThreshold || 2000;
      const insideDhakaFee = config.deliveryInsideDhaka !== undefined ? config.deliveryInsideDhaka : 60;
      const outsideDhakaFee = config.deliveryOutsideDhaka !== undefined ? config.deliveryOutsideDhaka : 120;
      const deliveryCharge = cartSubtotal >= freeThreshold ? 0 : (isDhaka ? insideDhakaFee : outsideDhakaFee);

      let discountAmount = 0;
      if (appliedCoupon) {
        if (appliedCoupon.type === "%") {
          discountAmount = Math.round((cartSubtotal * appliedCoupon.value) / 100);
        } else {
          discountAmount = appliedCoupon.value;
        }
      }
      const cartGrandTotal = Math.max(0, cartSubtotal - discountAmount) + deliveryCharge;

      // Apply Coupon
      const handleApplyCoupon = () => {
        const found = coupons.find(c => c.code.toUpperCase() === couponInput.trim().toUpperCase() && c.active);
        if (!found) {
          notify("ভুল বা মেয়াদোত্তীর্ণ কুপন কোড!");
          return;
        }
        if (cartSubtotal < found.minOrder) {
          notify(`এই কুপন ব্যবহারের জন্য ন্যূনতম ${found.minOrder} ৳ এর অর্ডার প্রয়োজন!`);
          return;
        }
        setAppliedCoupon(found);
        notify(`🎉 কুপন "${found.code}" কার্যকর হয়েছে!`);
      };

      // Place Order
      const handlePlaceOrder = (e) => {
        e.preventDefault();
        if (!checkoutForm.name || !checkoutForm.phone || !checkoutForm.address) {
          notify("অনুগ্রহ করে নাম, মোবাইল নম্বর এবং ঠিকানা পূরণ করুন!");
          return;
        }
        if (cart.length === 0) {
          notify("আপনার কার্ট খালি!");
          return;
        }

        const newOrderId = "ORD-" + Math.floor(1000 + Math.random() * 9000);
        const orderData = {
          id: newOrderId,
          customer: checkoutForm.name,
          phone: checkoutForm.phone,
          district: checkoutForm.district,
          thana: checkoutForm.thana || "সদর",
          address: checkoutForm.address,
          total: cartGrandTotal,
          subtotal: cartSubtotal,
          discount: discountAmount,
          couponCode: appliedCoupon ? appliedCoupon.code : "",
          deliveryCharge,
          paymentMethod: checkoutForm.paymentMethod,
          status: "Pending",
          date: new Date().toISOString().split("T")[0],
          items: cart.map(i => ({ 
            productId: i.id, 
            name: i.name, 
            qty: i.qty, 
            price: i.price, 
            image: i.images?.[0],
            sourceUrl: i.sourceUrl || "" 
          })),
          trackingId: ""
        };

        // Deduct stock
        setProducts(prev => prev.map(p => {
          const inCart = cart.find(c => c.id === p.id);
          const updatedP = inCart ? { ...p, stock: Math.max(0, p.stock - inCart.qty) } : p;
          if (inCart) syncDocToCloud("products", p.id, updatedP);
          return updatedP;
        }));

        setOrders(prev => [orderData, ...prev]);
        syncDocToCloud("orders", newOrderId, orderData);

        setCart([]);
        setIsCheckoutOpen(false);
        setIsCartOpen(false);
        setAppliedCoupon(null);
        setCouponInput("");
        notify(`ধন্যবাদ ${checkoutForm.name}! আপনার অর্ডার সফল হয়েছে (ID: #${newOrderId}) 🎉`);
      };

      // Courier Dispatch
      const dispatchCourier = (orderId, provider) => {
        const prefix = provider === "Steadfast" ? "ST-" : "PTH-" ;
        const tracking = prefix + Math.floor(100000 + Math.random() * 900000);

          const reader = new FileReader();

            img.onload = () => {
              const canvas = document.createElement("canvas");
              let width = img.width;
              let height = img.height;

              if (width > height) {
                if (width > maxWidth) {
                  height = Math.round((height * maxWidth) / width);
                  width = maxWidth;
                }
              } else {
                if (height > maxHeight) {
                  width = Math.round((width * maxHeight) / height);
                  height = maxHeight;
                }
              }

              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext("2d");
              ctx.drawImage(img, 0, 0, width, height);

              // Use WebP if supported, fallback to JPEG
              let dataUrl = canvas.toDataURL("image/webp", quality);
              if (!dataUrl.startsWith("data:image/webp")) {
                dataUrl = canvas.toDataURL("image/jpeg", quality);
              }
              resolve(dataUrl);
            };
            img.onerror = () => resolve(e.target.result);
            img.src = e.target.result;
          };
          reader.onerror = () => resolve(null);
          reader.readAsDataURL(file);
        });

                          {/* Image from current input if not added yet */}
                          {imageUrlInput && !productForm.images.includes(imageUrlInput) && (
                            <div className="relative group w-20 h-20 rounded-2xl overflow-hidden border-2 border-dashed border-[#7a1c2b] bg-white flex items-center justify-center">
                              <img 
                                src={imageUrlInput} 
                                alt="Live Preview" 
                                className="w-full h-full object-cover" 
                                onLoad={() => setImgLoadStatus("loaded")}
                                onError={() => setImgLoadStatus("error")}
                              />
                              <span className="absolute bottom-0 inset-x-0 bg-black/70 text-white text-[8px] text-center py-0.5">
                                প্রিভিউ
                              </span>
                            </div>
                          )}

                          {/* Gallery items */}
                          {productForm.images.map((img, idx) => (
                            <div key={idx} className="relative group w-20 h-20 rounded-2xl overflow-hidden border-2 border-[#7a1c2b] bg-white shadow-sm">
                              <img 
                                src={img} 
                                alt={`Product ${idx+1}`} 
                                className="w-full h-full object-cover" 
                                onError={(e) => { e.target.onerror = null; e.target.src = imgSharee; }}
                              />
                              <button 
                                type="button" 
                                onClick={() => setProductForm(prev => ({ ...prev, images: prev.images.filter((_, i) => i !== idx) }))}
                                className="absolute top-1 right-1 w-5 h-5 bg-red-600 text-white rounded-full flex items-center justify-center text-[10px] font-bold shadow hover:scale-110"
                                title="মুছে ফেলুন"
                              >
                                ✕
                              </button>
                              {idx === 0 && (
                                <span className="absolute bottom-0 inset-x-0 bg-[#7a1c2b] text-white text-[8px] text-center py-0.5 font-bold">
                                  মূল ছবি
                                </span>
                              )}
                            </div>
                          ))}
                        </div>

                        {imgLoadStatus === "loaded" && (
                          <p className="text-[11px] text-green-700 font-semibold mt-2 flex items-center gap-1">
                            <span>✓</span>
                            <span>ছবির লিঙ্ক কার্যকর এবং সফলভাবে লোড হয়েছে!</span>
                          </p>
                        )}
                        {imgLoadStatus === "error" && (
                          <p className="text-[11px] text-red-600 font-semibold mt-2">
                            ⚠️ লিঙ্কটি থেকে ছবি লোড হতে পারেনি। সঠিক Image URL দিন বা ডিভাইস থেকে ছবি আপলোড করুন।
                          </p>
                        )}
                      </div>
                    )}
                  </div>

                  {/* SOURCE SUPPLIER LINK (DROPSHIP / SOURCING TRACKING) */}
                  <div>
                    <label className="text-xs font-semibold text-gray-700">সোর্স ওয়েবসাইট লিঙ্ক (Dropship / Supplier URL - অপশনাল)</label>
                    <input 
                      type="url" 
                      placeholder="অর্ডার আসলে যে ওয়েবসাইট থেকে আপনি পণ্য কিনবেন সেই লিংক..." 
                      value={productForm.sourceUrl || ''} 
                      onChange={(e) => setProductForm({ ...productForm, sourceUrl: e.target.value })}
                      className="w-full bg-[#fffaf5] border rounded-full px-5 py-2.5 text-xs outline-none mt-1 focus:border-[#7a1c2b]" 
                    />
                  </div>

                  {/* DESCRIPTION */}
                  <div>
                    <label className="text-xs font-semibold text-gray-700">পণ্য সম্পর্কে বিস্তারিত বিবরণ</label>
                    <textarea 
                      rows="3" 
                      value={productForm.description} 
                      onChange={(e) => setProductForm({ ...productForm, description: e.target.value })}
                      placeholder="পণ্যের উপাদান, সাইজ, কালার ও অন্যান্য সুবিধা লিখুন..." 
                      className="w-full bg-[#fffaf5] border rounded-2xl p-3 text-sm outline-none mt-1 focus:border-[#7a1c2b]" 
                    />
                  </div>

                  <button 
                    onClick={() => {
                      if (!productForm.name || !productForm.price) return notify("নাম ও মূল্য আবশ্যক!");
                      const allImages = [...productForm.images];
                      if (imageUrlInput && !allImages.includes(imageUrlInput)) {
                        allImages.push(imageUrlInput);
                      }
                      const finalImages = allImages.length > 0 ? allImages : [imgSharee];

                      if (editingProduct) {
                        const updated = { 
                          ...editingProduct, 
                          ...productForm, 
                          images: finalImages 
                        };
                        setProducts(prev => prev.map(p => p.id === editingProduct.id ? updated : p));
                        syncDocToCloud("products", editingProduct.id, updated);
                        notify("প্রোডাক্ট সফলভাবে আপডেট হয়েছে! ✅");
                      } else {
                        const newP = {
                          id: "p" + Date.now(),
                          ...productForm,
                          images: finalImages,
                          sku: productForm.sku || `SAJ-${Math.floor(100 + Math.random() * 900)}`,
                          rating: 4.8,
                          reviewsCount: 1
                        };
                        setProducts(prev => [newP, ...prev]);
                        syncDocToCloud("products", newP.id, newP);
                        notify("নতুন প্রোডাক্ট সফলভাবে যুক্ত হয়েছে! ✨");
                      }
                      setIsProductModalOpen(false);
                      setImageUrlInput("");
                      setExternalLinkInput("");
                    }}
                    className="w-full bg-[#7a1c2b] text-white py-3.5 rounded-full font-bold text-sm shadow-lg hover:bg-[#681727] transition"
                  >
                    প্রোডাক্ট সংরক্ষণ করুন (Save Product)
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ========================================================= */}
          {/* EDIT BANNER MODAL (AUTO COMPRESSION & CLOUD SYNC) */}
          {/* ========================================================= */}
          {isBannerModalOpen && editingBanner && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl w-full max-w-lg max-h-[92vh] overflow-y-auto p-6 border shadow-2xl animate-fadeIn">
                <div className="flex justify-between items-center mb-4 pb-3 border-b border-[#f3e2d0]">
                  <div>
                    <h3 className="font-bold text-lg text-[#7a1c2b]">ব্যানার তথ্য ও ছবি পরিবর্তন</h3>
                    <p className="text-xs text-gray-500">হোমপেজ স্লাইডার ব্যানার এডিট ও ক্লাউড পারসিস্টেন্স</p>
                  </div>
                  <button onClick={() => setIsBannerModalOpen(false)} className="w-8 h-8 rounded-full bg-[#fff8f0] border flex items-center justify-center font-bold text-gray-600 hover:text-black">✕</button>
                </div>

                <div className="space-y-4">
                  <div>
                    <label className="text-xs font-semibold text-gray-700">ব্যানার টাইটেল *</label>
                    <input 
                      type="text" 
                      value={editingBanner.title} 
                      onChange={(e) => setEditingBanner({ ...editingBanner, title: e.target.value })}
                      className="w-full bg-[#fffaf5] border rounded-full px-5 py-2.5 text-sm outline-none mt-1 focus:border-[#7a1c2b]"
                    />
                  </div>

                  <div>
                    <label className="text-xs font-semibold text-gray-700">সাবটাইটেল / অফার টেক্সট</label>
                    <input 
                      type="text" 
                      value={editingBanner.subtitle || ''} 
                      onChange={(e) => setEditingBanner({ ...editingBanner, subtitle: e.target.value })}
                      className="w-full bg-[#fffaf5] border rounded-full px-5 py-2.5 text-sm outline-none mt-1 focus:border-[#7a1c2b]"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-xs font-semibold text-gray-700">বাটন টেক্সট</label>
                      <input 
                        type="text" 
                        value={editingBanner.buttonText || 'কালেকশন দেখুন'} 
                        onChange={(e) => setEditingBanner({ ...editingBanner, buttonText: e.target.value })}
                        className="w-full bg-[#fffaf5] border rounded-full px-4 py-2 text-xs outline-none mt-1"
                      />
                    </div>
                    <div>
                      <label className="text-xs font-semibold text-gray-700">বাটন লিঙ্ক</label>
                      <input 
                        type="text" 
                        value={editingBanner.link || '#products'} 
                        onChange={(e) => setEditingBanner({ ...editingBanner, link: e.target.value })}
                        className="w-full bg-[#fffaf5] border rounded-full px-4 py-2 text-xs outline-none mt-1"
                      />
                    </div>
                  </div>

                  {/* Banner Image Preview & Upload with Compression */}
                  <div>
                    <div className="flex items-center justify-between mb-1.5">
                      <label className="text-xs font-semibold text-gray-700">ব্যানারের ছবি (Banner Image)</label>
                      <span className="text-[10px] text-emerald-700 font-bold bg-emerald-50 px-2 py-0.5 rounded-full border border-emerald-200">অটো কম্প্রেশন সহ ক্লাউড সেভ ✓</span>
                    </div>

                    <div className="h-40 rounded-2xl overflow-hidden border-2 border-[#d4a574] relative bg-gray-100 shadow-inner">
                      <img src={editingBanner.image} alt="Banner Preview" className="w-full h-full object-cover" />
                    </div>

                    <div className="flex gap-2 mt-2.5">
                      <input 
                        type="text" 
                        placeholder="অথবা ছবির সরাসরি URL দিন..." 
                        value={editingBanner.image} 
                        onChange={(e) => setEditingBanner({ ...editingBanner, image: e.target.value })}
                        className="flex-1 bg-[#fffaf5] border rounded-full px-4 py-2 text-xs outline-none focus:border-[#7a1c2b]"
                      />
                      <input 
                        type="file" 
                        accept="image/*" 
                        ref={bannerEditFileRef} 
                        onChange={(e) => handleImageUpload(e, (dataUrl) => setEditingBanner(prev => ({ ...prev, image: dataUrl })), 'banner')}
                        className="hidden" 
                      />
                      <button 
                        type="button" 
                        onClick={() => bannerEditFileRef.current?.click()} 
                        className="bg-[#7a1c2b] text-white px-5 py-2 rounded-full text-xs font-bold hover:bg-[#681727] whitespace-nowrap shadow"
                      >
                        📷 ছবি আপলোড
                      </button>
                    </div>
                  </div>

                  <label className="flex items-center gap-2 text-xs font-bold text-gray-700 cursor-pointer pt-1">
                    <input 
                      type="checkbox" 
                      checked={editingBanner.active} 
                      onChange={(e) => setEditingBanner({ ...editingBanner, active: e.target.checked })}
                      className="w-4 h-4 accent-[#7a1c2b]"
                    />
                    হোমপেজে এই ব্যানারটি সক্রিয় (Active) রাখুন
                  </label>

                  <button 
                    onClick={async () => {
                      if (!editingBanner.title) return notify("ব্যানার টাইটেল দিন!");
                      const updatedBanners = banners.map(b => b.id === editingBanner.id ? editingBanner : b);
                      setBanners(updatedBanners);
                      setStored("banners", updatedBanners);
                      await syncDocToCloud("banners", editingBanner.id, editingBanner);
                      setIsBannerModalOpen(false);
                      notify("ব্যানার সফলভাবে আপডেট ও ক্লাউডে সংরক্ষিত হয়েছে! 🖼️");
                    }}
                    className="w-full bg-[#7a1c2b] text-white py-3 rounded-full font-bold text-sm shadow-md hover:bg-[#681727] transition mt-2"
                  >
                    ব্যানার আপডেট ও সেভ করুন ✓
                  </button>
                </div>
              </div>
            </div>
          )}
          <a 
            href={`https://wa.me/${config.whatsapp}?text=Hello%20SAJGOJ%20FASHION,%20I%20want%20to%20order`} 
            target="_blank" 
            rel="noopener noreferrer" 
            className="fixed bottom-6 right-6 z-40 w-14 h-14 rounded-full bg-[#25D366] text-white flex items-center justify-center shadow-2xl border-2 border-white hover:scale-110 transition duration-300"
            title="WhatsApp Helpline"
          >
            <span className="text-2xl font-bold">💬</span>
          </a>

          {/* Toast Notification */}
          {toast && (
            <div className="fixed bottom-20 left-1/2 -translate-x-1/2 z-50 bg-[#2c1810] text-[#fff8f0] px-6 py-3 rounded-full text-xs sm:text-sm font-semibold shadow-2xl border border-[#d4a574] animate-fadeIn">
              {toast}
            </div>
          )}

          </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
