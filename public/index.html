      color: #000000;
    }

    .storefront-page-canvas {
      background: linear-gradient(135deg, var(--sf-page-bg-start, #c7d2fe) 0%, var(--sf-page-bg-mid, #f5d0fe) 50%, var(--sf-page-bg-end, #bae6fd) 100%);

      border: 1.5px solid var(--sf-block-border, rgba(255, 255, 255, 0.88)) !important;

    }

    }
    .cta-dark-pill:hover {

    /* Table Cards, and Photo Cards                              */
    /* ========================================================= */
    .red-black-tab {
      background: linear-gradient(135deg, #fca5a5 0%, #f87171 100%) !important;
      color: #000000 !important;
      border: 1.5px solid rgba(220, 38, 38, 0.65) !important;
      box-shadow: 0 4px 12px -4px rgba(220, 38, 38, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.55) !important;
      font-weight: 700 !important;
    }
    .red-black-tab:hover {
      background: linear-gradient(135deg, #f87171 0%, #ef4444 100%) !important;
      color: #000000 !important;
      border-color: #991b1b !important;
    }
    .red-black-tab-active {
      background: linear-gradient(135deg, #ff5252 0%, #ef4444 100%) !important;
      color: #000000 !important;
      border: 2px solid #7f1d1d !important;
      box-shadow: 0 10px 22px -6px rgba(220, 38, 38, 0.48), inset 0 1.5px 1px rgba(255, 255, 255, 0.65) !important;
      font-weight: 900 !important;

    .red-black-tab *,

      color: #000000 !important;
    }

      color: #000000 !important;
      border: 1.5px solid rgba(255, 255, 255, 0.72) !important;

    .red-black-table-card {
      background: linear-gradient(155deg, #fca5a5 0%, #f87171 100%) !important;
      color: #000000 !important;
      border: 1.5px solid rgba(255, 255, 255, 0.78) !important;
      box-shadow: 0 16px 34px -10px rgba(220, 38, 38, 0.3), inset 0 1.5px 1px rgba(255, 255, 255, 0.6) !important;

    .red-black-table-card h1,
    .red-black-table-card h2,
    .red-black-table-card h3,
    .red-black-table-card h4,
    .red-black-table-card h5,

      color: #000000 !important;
      border-color: #b91c1c !important;
      font-weight: 800 !important;

    .red-black-table tbody tr {
      background: #fecaca !important;
      color: #000000 !important;
      border-color: rgba(220, 38, 38, 0.35) !important;
    }
    .red-black-table tbody tr:nth-child(even) {
      background: #fca5a5 !important;
    }
    .red-black-table tbody tr:hover {
      background: #f87171 !important;
    }
    .red-black-table tbody td {
      color: #000000 !important;
    }

    .red-black-photo-card {
      background: linear-gradient(155deg, #ff7b7b 0%, #f87171 58%, #fca5a5 100%) !important;
      color: #000000 !important;
      border: 1.5px solid rgba(255, 255, 255, 0.8) !important;
      box-shadow: 0 14px 32px -8px rgba(220, 38, 38, 0.32), inset 0 1.5px 1px rgba(255, 255, 255, 0.6) !important;
    }
    .red-black-photo-card h1,
    .red-black-photo-card h2,
    .red-black-photo-card h3,
    .red-black-photo-card h4,
    .red-black-photo-card h5,
    .red-black-photo-card p,
    .red-black-photo-card span,
    .red-black-photo-card label,
    .red-black-photo-card a {
      color: #000000;
    }
    /* Protect dark CTA buttons & white photo overlay badges inside red cards */
    .red-black-photo-card .cta-dark-pill,
    .red-black-photo-card .cta-dark-pill *,
    .red-black-bottom-card .cta-dark-pill,
    .red-black-bottom-card .cta-dark-pill *,

    .red-black-table-card .cta-dark-pill *,

    .keep-white-text * {
      color: #ffffff !important;
    }
    /* Crisp white pill/box backdrops behind black card text without overflowing card edges */
    .red-black-photo-card .product-title {
      background-color: rgba(255, 255, 255, 0.95);
      color: #000000 !important;
      padding: 3px 6px;
      border-radius: 10px;
      display: block;
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
      overflow: hidden;
      margin: 0;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
      word-break: break-word;
    }
    .red-black-photo-card .product-price {
      background-color: rgba(255, 255, 255, 0.96);
      color: #000000 !important;
      padding: 2px 6px;
      border-radius: 9999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      max-width: 100%;
      min-width: 0;
      flex-shrink: 1;
      box-sizing: border-box;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      line-height: 1.2;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
    }
    .red-black-photo-card .category-pill-label {
      background-color: rgba(255, 255, 255, 0.95);
      color: #000000 !important;
      padding: 2px 5px;
      border-radius: 9999px;
      display: block;
      width: 100%;
      max-width: 100%;

      overflow: hidden;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);

    .product-rating-yellow,

      color: #fde047 !important;

    .red-black-photo-card input,
    .red-black-table-card input,
    .red-black-bottom-card input,
    .red-black-photo-card select,
    .red-black-table-card select,

    /* ========================================================= */

    .navy-pill-badge {
      background: linear-gradient(135deg, var(--sf-block-title-bg, #0f294a) 0%, var(--sf-block-title-bg-end, #1e3a8a) 100%) !important;
      color: var(--sf-block-title-text, #ffffff) !important;
      border: 1.5px solid rgba(255, 255, 255, 0.42) !important;

      color: var(--sf-reels-cap-text, #ffffff) !important;
    }

      background: linear-gradient(135deg, var(--sf-seemore-bg, #0f294a) 0%, var(--sf-seemore-bg-end, #1e3a8a) 100%) !important;

      color: var(--sf-seemore-text, #ffffff) !important;

    /* ========================================================= */
    /* HOME PRODUCT DISPLAY CARD: NAVY BODY + CREAM PRICE BOX    */
    /* Mobile-First Responsive Padding, Typography & Wrapping    */
    /* ========================================================= */
    .storefront-navy-card {
      background: linear-gradient(175deg, var(--sf-card-body-bg, #0f294a) 0%, var(--sf-card-body-bg-end, #172554) 100%) !important;
      color: var(--sf-card-title-text, #ffffff);
      border: 1.5px solid var(--sf-card-border, rgba(255, 255, 255, 0.72)) !important;
      border-radius: 16px;
      box-shadow: 0 12px 26px -8px rgba(15, 41, 74, 0.36), inset 0 1px 0 rgba(255, 255, 255, 0.25) !important;
      transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.26s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.26s ease !important;
      will-change: transform, box-shadow;
    }
    .storefront-navy-card:hover,
    .storefront-navy-card:focus-within {
      transform: translateY(-4px) scale(1.025) !important;
      box-shadow: 0 22px 38px -10px rgba(15, 41, 74, 0.54), 0 8px 18px -6px rgba(212, 165, 116, 0.34), inset 0 1px 0 rgba(255, 255, 255, 0.42) !important;
      z-index: 2;
    }
    .storefront-navy-card:active {
      transform: translateY(-1px) scale(0.99) !important;
    }

      .storefront-navy-card,
      .storefront-navy-card:hover,
      .storefront-navy-card:focus-within,
      .storefront-navy-card:active {
        transition: none !important;
        transform: none !important;
      }

      min-width: 0;
      width: 100%;

    }

      flex-direction: column;
      gap: 5px;
      min-width: 0;
      width: 100%;
    }

  <!-- Instant Head Script: Pre-applies saved brand color and favicon immediately to eliminate any flash of demo styling on page reload -->
  <script>
    (function() {
      try {
        var raw = localStorage.getItem("sajgoj_store_config");
        if (raw) {
          var cfg = JSON.parse(raw);
          if (cfg && cfg.primaryColor) {
            document.documentElement.style.setProperty('--primary-color', cfg.primaryColor);
            document.documentElement.style.setProperty('--maroon', cfg.primaryColor);
          }
          if (cfg && cfg.favicon) {
            var link = document.querySelector("link[rel*='icon']") || document.createElement('link');
            link.type = 'image/x-icon';
            link.rel = 'shortcut icon';
            link.href = cfg.favicon;
            document.getElementsByTagName('head')[0].appendChild(link);
          }
        }
      } catch(e) {}
    })();
  </script>
