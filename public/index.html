  <style>
    :root {

    }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.25s ease-out forwards;
    }

    /* Dynamic Storefront Theme Overrides linked to CSS Variables */
    .theme-primary-bg,
    [class*="bg-[#7a1c2b]"],
    [class*="bg-[#7c1d2a]"] {
      background-color: var(--primary-color) !important;
    }

    .theme-primary-text,
    [class*="text-[#7a1c2b]"],
    [class*="text-[#7c1d2a]"] {
      color: var(--primary-color) !important;
    }

    .theme-primary-border,
    [class*="border-[#7a1c2b]"],
    [class*="border-[#7c1d2a]"] {
      border-color: var(--primary-color) !important;
    }

    [class*="hover:bg-[#681727]"]:hover,
    [class*="hover:bg-[#63141f]"]:hover {
      background-color: var(--primary-hover) !important;
    }

    [class*="focus:border-[#7a1c2b]"]:focus,
    [class*="focus:border-[#7c1d2a]"]:focus,
    [class*="focus:ring-[#7a1c2b]"]:focus {
      border-color: var(--primary-color) !important;
    }

    [class*="accent-[#7a1c2b]"],
    [class*="accent-[#7c1d2a]"] {
      accent-color: var(--primary-color) !important;
    }
  </style>

  <!-- Instant Head Script: Pre-applies saved brand color and favicon immediately to eliminate any flash of demo styling on page reload -->
  <script>
    (function() {
      try {
        var raw = localStorage.getItem("sajgoj_store_config");
        if (raw) {
          var cfg = JSON.parse(raw);
          if (cfg && cfg.primaryColor) {
            document.documentElement.style.setProperty('--primary-color', cfg.primaryColor);
            document.documentElement.style.setProperty('--maroon', cfg.primaryColor);
          }
          if (cfg && cfg.favicon) {
            var link = document.querySelector("link[rel*='icon']") || document.createElement('link');
            link.type = 'image/x-icon';
            link.rel = 'shortcut icon';
            link.href = cfg.favicon;
            document.getElementsByTagName('head')[0].appendChild(link);
          }
        }
      } catch(e) {}
    })();
  </script>
</head>
