    <script>
      // Prevent Vite HMR WebSocket closed without opened error in proxy / iframe environments
      (function () {
        if (typeof window === 'undefined') return;

        // Universal case-insensitive checker for Vite HMR / WebSocket disconnect errors
        function isViteHmrError(err) {
          if (!err) return false;
          var msg = typeof err === 'string'
            ? err
            : (err.message || (err.reason && (err.reason.message || String(err.reason))) || String(err) || '');
          var stack = err.stack ? String(err.stack) : '';
          var str = (msg + ' ' + stack).toLowerCase();
          return str.includes('websocket') ||
                 str.includes('vite') ||
                 str.includes('hmr') ||
                 str.includes('disconnected') ||
                 str.includes('closed without opened');
        }

        // Dummy WebSocket implementation to safely absorb any Vite HMR connections
        const OrigWS = window.WebSocket;
        if (OrigWS) {
          const SafeWS = function (url, protocols) {
            const handlers = { open: [], message: [], close: [], error: [] };
            const dummy = {
              CONNECTING: 0,
              OPEN: 1,
              CLOSING: 2,
              CLOSED: 3,
              readyState: 1,
              bufferedAmount: 0,
              extensions: '',
              protocol: 'vite-hmr',
              url: typeof url === 'string' ? url : '',
              binaryType: 'blob',
              send: function () {},
              close: function () {},
              addEventListener: function (type, fn) {
                if (handlers[type]) handlers[type].push(fn);
                if (type === 'open') {
                  setTimeout(() => {
                    try { fn.call(dummy, { type: 'open', target: dummy }); } catch (e) {}
                  }, 0);
                }
              },
              removeEventListener: function (type, fn) {
                if (handlers[type]) {
                  handlers[type] = handlers[type].filter((cb) => cb !== fn);
                }
              },
              dispatchEvent: function () { return true; },
              onopen: null,
              onclose: null,
              onerror: null,
              onmessage: null,
            };
            try { Object.setPrototypeOf(dummy, OrigWS.prototype); } catch (e) {}
            setTimeout(() => {
              if (typeof dummy.onopen === 'function') {
                try { dummy.onopen.call(dummy, { type: 'open', target: dummy }); } catch (e) {}
              }
            }, 0);
            return dummy;
          };

          SafeWS.prototype = OrigWS.prototype;
          SafeWS.CONNECTING = 0;
          SafeWS.OPEN = 1;
          SafeWS.CLOSING = 2;
          SafeWS.CLOSED = 3;
          window.WebSocket = SafeWS;
        }

        // Catch any remaining unhandled WebSocket rejections or errors
        window.addEventListener('error', function (e) {
          if (isViteHmrError(e.error) || isViteHmrError(e.message)) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function (e) {
          if (isViteHmrError(e.reason)) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);

        // Filter harmless Vite HMR WebSocket console errors in AI Studio iframe
        const origError = console.error;
        console.error = function (...args) {
          for (let i = 0; i < args.length; i++) {
            if (isViteHmrError(args[i])) {
              return;
            }
          }
          origError.apply(console, args);
        };
      })();
    </script>

    <div id="root"></div>
    <script>
      (function () {
        var SYNC_CHANNEL_NAME = "sajgoj_inventory_sync";
        var STORE_PRODUCTS_KEY = "sajgoj_store_products";
        var POS_PRODUCTS_KEY = "sajgoj_products";
        var isApplyingRemoteSync = false;
        var syncChannel = null;
        try {
          if (typeof BroadcastChannel !== "undefined") {
            syncChannel = new BroadcastChannel(SYNC_CHANNEL_NAME);
          }
        } catch (err) {}

        var rawSetItem = Storage.prototype.setItem;

        function matchProduct(a, b) {
          if (!a || !b) return false;
          if (a.id !== undefined && b.id !== undefined && String(a.id) === String(b.id)) return true;
          if (a.sku && b.sku && String(a.sku).toLowerCase() === String(b.sku).toLowerCase()) return true;
          var aName = a.name || a.nameBn || a.nameEn;
          var bName = b.name || b.nameBn || b.nameEn;
          return Boolean(aName && bName && aName === bName);
        }

        function emitStorageUpdate(key, oldVal, newVal) {
          try {
            window.dispatchEvent(new StorageEvent("storage", {
              key: key,
              oldValue: oldVal,
              newValue: newVal,
              storageArea: window.localStorage
            }));
          } catch (se) {
            window.dispatchEvent(new Event("storage"));
          }
        }

        // Mirror POS stock changes into Website's sajgoj_store_products in localStorage
        function syncPosCatalogToWebsiteStorage(posProducts) {
          if (!Array.isArray(posProducts) || posProducts.length === 0) return;
          try {
            var rawStore = window.localStorage.getItem(STORE_PRODUCTS_KEY);
            if (!rawStore) return;
            var storeProducts = JSON.parse(rawStore);
            if (!Array.isArray(storeProducts)) return;
            var now = Date.now();
            var changed = false;

            var nextStoreProducts = storeProducts.map(function (wp) {
              var posMatch = posProducts.find(function (pp) { return matchProduct(pp, wp); });
              if (!posMatch || posMatch.stock === undefined) return wp;
              var posStock = Math.max(0, Number(posMatch.stock) || 0);
              var curStock = Math.max(0, Number(wp.stock) || 0);
              var posTime = Number(posMatch.stockUpdatedAt) || 0;
              var curTime = Number(wp.stockUpdatedAt) || 0;
              if (posStock !== curStock && posTime >= curTime) {
                changed = true;
                return Object.assign({}, wp, {
                  stock: posStock,
                  stockUpdatedAt: posTime || now,
                  lastSyncSource: "POS_LOCAL_SYNC"
                });
              }
              return wp;
            });

            if (changed) {
              var nextSerialized = JSON.stringify(nextStoreProducts);
              isApplyingRemoteSync = true;
              rawSetItem.call(window.localStorage, STORE_PRODUCTS_KEY, nextSerialized);
              emitStorageUpdate(STORE_PRODUCTS_KEY, rawStore, nextSerialized);
              isApplyingRemoteSync = false;
            }
          } catch (err) {
            isApplyingRemoteSync = false;
          }
        }

        // Merge Website catalog updates into POS sajgoj_products and refresh mounted POS state
        function applyProductsToPosStorage(nextProducts, mergeMode) {
          if (!Array.isArray(nextProducts)) return;
          try {
            var prevRaw = window.localStorage.getItem(POS_PRODUCTS_KEY);
            var existingPos = prevRaw ? JSON.parse(prevRaw) : [];
            if (!Array.isArray(existingPos)) existingPos = [];
            var finalPos = nextProducts;

            if (mergeMode && existingPos.length > 0) {
              var changed = false;
              finalPos = existingPos.map(function (pp) {
                var incoming = nextProducts.find(function (np) { return matchProduct(np, pp); });
                if (!incoming || incoming.stock === undefined) return pp;
                var incStock = Math.max(0, Number(incoming.stock) || 0);
                var curStock = Math.max(0, Number(pp.stock) || 0);
                var incTime = Number(incoming.stockUpdatedAt) || 0;
                var curTime = Number(pp.stockUpdatedAt) || 0;
                if (incStock !== curStock && (incTime > curTime || curTime === 0)) {
                  changed = true;
                  return Object.assign({}, pp, {
                    stock: incStock,
                    stockUpdatedAt: incTime || Date.now(),
                    lastSyncSource: incoming.lastSyncSource || "STOREFRONT_SYNC"
                  });
                }
                return pp;
              });
              if (!changed) return;
            }

            var serialized = JSON.stringify(finalPos);
            if (prevRaw === serialized) return;
            isApplyingRemoteSync = true;
            rawSetItem.call(window.localStorage, POS_PRODUCTS_KEY, serialized);
            emitStorageUpdate(POS_PRODUCTS_KEY, prevRaw, serialized);
            if (typeof window.__SAJGOJ_SET_POS_PRODUCTS__ === "function") {
              window.__SAJGOJ_SET_POS_PRODUCTS__(finalPos);
            }
          } catch (err) {
            console.warn("POS storage sync apply error:", err);
          } finally {
            isApplyingRemoteSync = false;
          }
        }

        // Reconcile on POS startup so transactions made while POS was closed are immediately applied
        try {
          var bootStoreRaw = window.localStorage.getItem(STORE_PRODUCTS_KEY);
          var bootPosRaw = window.localStorage.getItem(POS_PRODUCTS_KEY);
          if (bootStoreRaw && bootPosRaw) {
            var bootStore = JSON.parse(bootStoreRaw);
            var bootPos = JSON.parse(bootPosRaw);
            if (Array.isArray(bootStore) && Array.isArray(bootPos)) {
              var posChanged = false;
              var storeChanged = false;
              var reconciledPos = bootPos.map(function (pp) {
                var wp = bootStore.find(function (sp) { return matchProduct(pp, sp); });
                if (!wp) return pp;
                var pStock = Math.max(0, Number(pp.stock) || 0);
                var sStock = Math.max(0, Number(wp.stock) || 0);
                var pTime = Number(pp.stockUpdatedAt) || 0;
                var sTime = Number(wp.stockUpdatedAt) || 0;
                if (pStock !== sStock && sTime > pTime) {
                  posChanged = true;
                  return Object.assign({}, pp, { stock: sStock, stockUpdatedAt: sTime });
                }
                return pp;
              });
              if (posChanged) {
                rawSetItem.call(window.localStorage, POS_PRODUCTS_KEY, JSON.stringify(reconciledPos));
              }
              bootStore.forEach(function (wp) {
                var pp = reconciledPos.find(function (item) { return matchProduct(item, wp); });
                if (pp && Number(pp.stock) !== Number(wp.stock) && (Number(pp.stockUpdatedAt) || 0) > (Number(wp.stockUpdatedAt) || 0)) {
                  storeChanged = true;
                }
              });
              if (storeChanged) {
                syncPosCatalogToWebsiteStorage(reconciledPos);
              }
            }
          }
        } catch (bootErr) {}

        // Hook localStorage.setItem to stamp stockUpdatedAt & emit instant updates when POS sells, returns, or adjusts stock
        try {
          Storage.prototype.setItem = function (key, value) {
            if (!isApplyingRemoteSync && this === window.localStorage && key === POS_PRODUCTS_KEY) {
              try {
                var prevRaw = window.localStorage.getItem(POS_PRODUCTS_KEY);
                var prevArr = prevRaw ? JSON.parse(prevRaw) : [];
                var nextArr = JSON.parse(value);
                if (Array.isArray(nextArr)) {
                  var now = Date.now();
                  var stamped = false;
                  nextArr = nextArr.map(function (np) {
                    var oldItem = Array.isArray(prevArr) ? prevArr.find(function (op) { return matchProduct(op, np); }) : null;
                    if (oldItem && Number(oldItem.stock) !== Number(np.stock)) {
                      stamped = true;
                      return Object.assign({}, np, { stockUpdatedAt: now, lastSyncSource: "POS_TRANSACTION" });
                    }
                    return np;
                  });
                  var finalValue = stamped ? JSON.stringify(nextArr) : value;
                  rawSetItem.call(this, key, finalValue);
                  syncPosCatalogToWebsiteStorage(nextArr);
                  var payload = {
                    type: "SAJGOJ_POS_PRODUCTS_UPDATED",
                    key: key,
                    data: nextArr,
                    source: "POS_IFRAME",
                    timestamp: now
                  };
                  if (window.parent && window.parent !== window) {
                    window.parent.postMessage(payload, "*");
                  }
                  if (syncChannel) {
                    syncChannel.postMessage(payload);
                  }
                  return;
                }
              } catch (hookErr) {}
            }

            rawSetItem.apply(this, arguments);

            if (!isApplyingRemoteSync && this === window.localStorage && (key === "sajgoj_sales" || key === "sajgoj_sales_returns" || key === "sajgoj_adjustments")) {
              try {
                var parsed = JSON.parse(value);
                var txPayload = {
                  type: "SAJGOJ_POS_SALES_UPDATED",
                  key: key,
                  data: parsed,
                  source: "POS_IFRAME",
                  timestamp: Date.now()
                };
                if (window.parent && window.parent !== window) {
                  window.parent.postMessage(txPayload, "*");
                }
                if (syncChannel) {
                  syncChannel.postMessage(txPayload);
                }
              } catch (e) {}
            }
          };
        } catch (err) {}

        function applyStockDeltaToPosStorage(items) {
          if (!Array.isArray(items) || items.length === 0) return;
          try {
            var raw = window.localStorage.getItem(POS_PRODUCTS_KEY);
            if (!raw) return;
            var posProducts = JSON.parse(raw);
            if (!Array.isArray(posProducts)) return;
            var changed = false;
            items.forEach(function (it) {
              var delta = typeof it.delta === "number" ? it.delta : -(Number(it.qty || it.quantity || 1));
              var match = posProducts.find(function (pp) {
                return String(pp.id) === String(it.productId || it.id) ||
                  (it.sku && pp.sku === it.sku) ||
                  (it.name && (pp.nameBn === it.name || pp.nameEn === it.name || pp.name === it.name));
              });
              if (match) {
                var targetStock = typeof it.newStock === "number"
                  ? Math.max(0, it.newStock)
                  : Math.max(0, (Number(match.stock) || 0) + delta);
                if (Number(match.stock) !== targetStock) {
                  match.stock = targetStock;
                  match.stockUpdatedAt = it.timestamp || Date.now();
                  changed = true;
                }
              }
            });
            if (changed) {
              applyProductsToPosStorage(posProducts, false);
            }
          } catch (err) {}
        }

        // Cross-tab localStorage listener inside POS
        window.addEventListener("storage", function (ev) {
          if (!ev || isApplyingRemoteSync || !ev.newValue) return;
          try {
            if (ev.key === POS_PRODUCTS_KEY) {
              var posList = JSON.parse(ev.newValue);
              if (Array.isArray(posList) && typeof window.__SAJGOJ_SET_POS_PRODUCTS__ === "function") {
                window.__SAJGOJ_SET_POS_PRODUCTS__(posList);
              }
            } else if (ev.key === STORE_PRODUCTS_KEY) {
              var storeList = JSON.parse(ev.newValue);
              if (Array.isArray(storeList)) {
                applyProductsToPosStorage(storeList, true);
              }
            }
          } catch (err) {}
        });

        if (syncChannel) {
          syncChannel.onmessage = function (ev) {
            var msg = ev && ev.data;
            if (!msg || msg.source === "POS_IFRAME") return;
            if (msg.type === "SAJGOJ_PRODUCTS_SYNC" && Array.isArray(msg.products)) {
              applyProductsToPosStorage(msg.products, false);
            } else if (msg.type === "SAJGOJ_STOCK_DELTA" && Array.isArray(msg.items)) {
              applyStockDeltaToPosStorage(msg.items);
            }
          };
        }

        window.addEventListener("message", function (e) {
          var data = e && e.data;
          if (!data) return;

          if (data.type === "SAJGOJ_PRODUCTS_SYNC" && Array.isArray(data.products)) {
            applyProductsToPosStorage(data.products, false);
            return;
          }

          if (data.type === "SAJGOJ_STOCK_DELTA" && Array.isArray(data.items)) {
            applyStockDeltaToPosStorage(data.items);
            return;
          }

          // Automatically populate search/SKU lookup field when barcode is scanned
          if (data.type !== "SAJGOJ_BARCODE_SCANNED") return;
          var code = data.sku || data.barcode || (data.product && (data.product.sku || data.product.barcode || data.product.id));
          if (!code) return;

          var inputs = document.querySelectorAll('input:not([type="hidden"]):not([type="checkbox"]):not([type="radio"])');
          for (var i = 0; i < inputs.length; i++) {
            var input = inputs[i];
            if (input.offsetParent !== null) {
              try {
                var valueSetter = Object.getOwnPropertyDescriptor(input, 'value')?.set;
                var prototype = Object.getPrototypeOf(input);
                var prototypeValueSetter = Object.getOwnPropertyDescriptor(prototype, 'value')?.set;
                if (prototypeValueSetter && valueSetter !== prototypeValueSetter) {
                  prototypeValueSetter.call(input, code);
                } else if (valueSetter) {
                  valueSetter.call(input, code);
                } else {
                  input.value = code;
                }
                input.dispatchEvent(new Event('input', { bubbles: true }));
                input.dispatchEvent(new Event('change', { bubbles: true }));
                input.focus();
                input.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', keyCode: 13, bubbles: true }));
                break;
              } catch (err) {
                console.warn("Could not auto-populate POS input:", err);
              }
            }
          }
        });

        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: "SAJGOJ_POS_READY", timestamp: Date.now() }, "*");
          }
        } catch (err) {}
      })();
    </script>
