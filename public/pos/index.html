    <script>
      // Prevent Vite HMR WebSocket closed without opened error in proxy / iframe environments
      (function () {
        if (typeof window === 'undefined') return;

        // Universal case-insensitive checker for Vite HMR / WebSocket disconnect errors
        function isViteHmrError(err) {
          if (!err) return false;
          var msg = typeof err === 'string'
            ? err
            : (err.message || (err.reason && (err.reason.message || String(err.reason))) || String(err) || '');
          var stack = err.stack ? String(err.stack) : '';
          var str = (msg + ' ' + stack).toLowerCase();
          return str.includes('websocket') ||
                 str.includes('vite') ||
                 str.includes('hmr') ||
                 str.includes('disconnected') ||
                 str.includes('closed without opened');
        }

        // Dummy WebSocket implementation to safely absorb any Vite HMR connections
        const OrigWS = window.WebSocket;
        if (OrigWS) {
          const SafeWS = function (url, protocols) {
            const handlers = { open: [], message: [], close: [], error: [] };
            const dummy = {
              CONNECTING: 0,
              OPEN: 1,
              CLOSING: 2,
              CLOSED: 3,
              readyState: 1,
              bufferedAmount: 0,
              extensions: '',
              protocol: 'vite-hmr',
              url: typeof url === 'string' ? url : '',
              binaryType: 'blob',
              send: function () {},
              close: function () {},
              addEventListener: function (type, fn) {
                if (handlers[type]) handlers[type].push(fn);
                if (type === 'open') {
                  setTimeout(() => {
                    try { fn.call(dummy, { type: 'open', target: dummy }); } catch (e) {}
                  }, 0);
                }
              },
              removeEventListener: function (type, fn) {
                if (handlers[type]) {
                  handlers[type] = handlers[type].filter((cb) => cb !== fn);
                }
              },
              dispatchEvent: function () { return true; },
              onopen: null,
              onclose: null,
              onerror: null,
              onmessage: null,
            };
            try { Object.setPrototypeOf(dummy, OrigWS.prototype); } catch (e) {}
            setTimeout(() => {
              if (typeof dummy.onopen === 'function') {
                try { dummy.onopen.call(dummy, { type: 'open', target: dummy }); } catch (e) {}
              }
            }, 0);
            return dummy;
          };

          SafeWS.prototype = OrigWS.prototype;
          SafeWS.CONNECTING = 0;
          SafeWS.OPEN = 1;
          SafeWS.CLOSING = 2;
          SafeWS.CLOSED = 3;
          window.WebSocket = SafeWS;
        }

        // Catch any remaining unhandled WebSocket rejections or errors
        window.addEventListener('error', function (e) {
          if (isViteHmrError(e.error) || isViteHmrError(e.message)) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function (e) {
          if (isViteHmrError(e.reason)) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);

        // Filter harmless Vite HMR WebSocket console errors in AI Studio iframe
        const origError = console.error;
        console.error = function (...args) {
          for (let i = 0; i < args.length; i++) {
            if (isViteHmrError(args[i])) {
              return;
            }
          }
          origError.apply(console, args);
        };
      })();
    </script>

    <script>
      // Automatically populate search/SKU lookup field when barcode is scanned
      window.addEventListener("message", function(e) {
        if (!e.data || e.data.type !== "SAJGOJ_BARCODE_SCANNED") return;
        var code = e.data.sku || e.data.barcode || (e.data.product && (e.data.product.sku || e.data.product.barcode || e.data.product.id));
        if (!code) return;
        
        // Find visible text/search inputs in the POS interface
        var inputs = document.querySelectorAll('input:not([type="hidden"]):not([type="checkbox"]):not([type="radio"])');
        for (var i = 0; i < inputs.length; i++) {
          var input = inputs[i];
          if (input.offsetParent !== null) {
            try {
              var valueSetter = Object.getOwnPropertyDescriptor(input, 'value')?.set;
              var prototype = Object.getPrototypeOf(input);
              var prototypeValueSetter = Object.getOwnPropertyDescriptor(prototype, 'value')?.set;
              if (prototypeValueSetter && valueSetter !== prototypeValueSetter) {
                prototypeValueSetter.call(input, code);
              } else if (valueSetter) {
                valueSetter.call(input, code);
              } else {
                input.value = code;
              }
              input.dispatchEvent(new Event('input', { bubbles: true }));
              input.dispatchEvent(new Event('change', { bubbles: true }));
              input.focus();
              input.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', keyCode: 13, bubbles: true }));
              break;
            } catch (err) {
              console.warn("Could not auto-populate POS input:", err);
            }
          }
        }
      });
    </script>
