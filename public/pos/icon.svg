<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="toyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
  </defs>
  <!-- Background squircle -->
  <rect width="512" height="512" rx="128" fill="#0f172a"/>
  <!-- Glowing subtle badge -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="#1e293b" stroke="#334155" stroke-width="4"/>
  <!-- Robot & Toy Blocks composition -->
  <!-- Block Base -->
  <polygon points="256,180 390,250 256,320 122,250" fill="#f59e0b" opacity="0.9"/>
  <polygon points="122,250 256,320 256,430 122,360" fill="#ef4444" opacity="0.9"/>
  <polygon points="390,250 256,320 256,430 390,360" fill="#3b82f6" opacity="0.9"/>
  <!-- Center Robot Head -->
  <rect x="186" y="100" width="140" height="120" rx="28" fill="url(#boxGrad)" stroke="#818cf8" stroke-width="6"/>
  <!-- Robot Antennas -->
  <line x1="220" y1="100" x2="200" y2="60" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/>
  <circle cx="196" cy="54" r="14" fill="#ef4444"/>
  <line x1="292" y1="100" x2="312" y2="60" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/>
  <circle cx="316" cy="54" r="14" fill="#10b981"/>
  <!-- Robot Eyes -->
  <circle cx="225" cy="145" r="14" fill="#ffffff"/>
  <circle cx="225" cy="145" r="7" fill="#0f172a"/>
  <circle cx="287" cy="145" r="14" fill="#ffffff"/>
  <circle cx="287" cy="145" r="7" fill="#0f172a"/>
  <!-- Smile -->
  <path d="M 230 185 Q 256 205 282 185" fill="transparent" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <!-- Cheeks -->
  <circle cx="206" cy="175" r="8" fill="#fb7185" opacity="0.8"/>
  <circle cx="306" cy="175" r="8" fill="#fb7185" opacity="0.8"/>
  <!-- Letter V badge on front -->
  <path d="M 230 320 L 256 375 L 282 320" fill="transparent" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
