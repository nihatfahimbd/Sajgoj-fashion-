    // =========================================================
    const idbStore = {
      dbPromise: null,
      init() {
        if (this.dbPromise) return this.dbPromise;
        this.dbPromise = new Promise((resolve) => {
          if (typeof indexedDB === "undefined") return resolve(null);
          try {
            const req = indexedDB.open("sajgoj_fashion_db", 1);
            req.onupgradeneeded = (e) => {
              const db = e.target.result;
              if (!db.objectStoreNames.contains("store_data")) {
                db.createObjectStore("store_data");
              }
            };
            req.onsuccess = () => resolve(req.result);
            req.onerror = (e) => {
              console.warn("IndexedDB open error:", e);
              resolve(null);
            };
          } catch(e) {
            resolve(null);
          }
        });
        return this.dbPromise;
      },
      async get(key) {
        try {
          const db = await this.init();
          if (!db) return null;
          return new Promise((resolve) => {
            try {
              const tx = db.transaction("store_data", "readonly");
              const store = tx.objectStore("store_data");
              const req = store.get(key);
              req.onsuccess = () => resolve(req.result || null);
              req.onerror = () => resolve(null);
            } catch(e) { resolve(null); }
          });
        } catch(e) { return null; }
      },
      async set(key, val) {
        try {
          const db = await this.init();
          if (!db) return false;
          return new Promise((resolve) => {
            try {
              const tx = db.transaction("store_data", "readwrite");
              const store = tx.objectStore("store_data");
              const req = store.put(val, key);
              req.onsuccess = () => resolve(true);
              req.onerror = () => resolve(false);
            } catch(e) { resolve(false); }
          });
        } catch(e) { return false; }
      }
    };

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.type = "triangle";
          osc.frequency.setValueAtTime(440, ctx.currentTime);
          gain.gain.setValueAtTime(0.08, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);
          osc.start();

            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.type = "sine";
            const startTime = ctx.currentTime + idx * 0.12;
            osc.frequency.setValueAtTime(freq, startTime);
            gain.gain.setValueAtTime(0.12, startTime);

          setIsFetchingUrl(false);

          return;

        // Try extracting Open Graph metadata via public CORS proxy

          const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
          const response = await fetch(proxyUrl);
          if (!response.ok) throw new Error("Proxy error");
          const data = await response.json();
          const html = data.contents;

          if (html) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, "text/html");

            // Extract Title
            const ogTitle = doc.querySelector('meta[property="og:title"]')?.getAttribute('content') || 
                            doc.querySelector('title')?.innerText || "";
            // Extract Image
            let ogImage = doc.querySelector('meta[property="og:image"]')?.getAttribute('content') || 
                          doc.querySelector('meta[name="twitter:image"]')?.getAttribute('content') || "";
            // Extract Description

                           doc.querySelector('meta[name="description"]')?.getAttribute('content') || "";

            // Fallback image search inside page
            if (!ogImage) {
              const imgEls = Array.from(doc.querySelectorAll('img[src*="http"]'));
              const productImg = imgEls.find(i => i.src && !i.src.includes('logo') && !i.src.includes('icon'));

            const cleanTitle = ogTitle ? ogTitle.replace(/[-|].*$/, "").trim() : "";
            
            setProductForm(prev => ({
              ...prev,
              name: cleanTitle || prev.name || "নতুন ইমপোর্ট করা পণ্য",
              description: ogDesc ? ogDesc.trim() : prev.description,
              sourceUrl: url,
              images: ogImage ? [ogImage, ...prev.images.filter(x => x !== ogImage)] : prev.images
            }));

              setImageUrlInput(ogImage);
              setImgLoadStatus("loaded");
              notify("✨ অন্য ওয়েবসাইট থেকে প্রোডাক্টের ছবি ও টাইটেল অটো-ইমপোর্ট হয়েছে!");

      const handleGoogleSignIn = async () => {
        setIsAuthLoading(true);
        try {
          if (typeof firebase !== "undefined" && firebase.auth) {
            const provider = new firebase.auth.GoogleAuthProvider();
            provider.setCustomParameters({ prompt: 'select_account' });
            const result = await firebase.auth().signInWithPopup(provider);
            const user = result.user;
            if (user) {
              const custId = `google_${user.uid}`;
              const custData = {
                id: custId,
                uid: user.uid,
                name: user.displayName || "গুগল ইউজার",
                email: user.email || "",
                photoUrl: sanitizePhotoUrl(user.photoURL),
                phone: user.phoneNumber ? normalizePhone(user.phoneNumber) : (currentUser?.phone || ""),
                authProvider: "google",
                createdAt: new Date().toISOString()
              };
              await saveCustomerProfile(custData);
              notify(`🎉 স্বাগতম ${custData.name}! গুগল একাউন্ট দিয়ে সফলভাবে লগইন হয়েছে!`);
              setIsAuthModalOpen(false);
              return;
            }
          }
          throw new Error("Popup not available");
        } catch (err) {
          console.warn("Google popup signIn note:", err.message || err);
          // Fallback Google prompt for sandboxed/restricted iframe browsers
          setAuthMode("google_fallback");
        } finally {
          setIsAuthLoading(false);
        }
      };

      const handleGoogleFallbackSubmit = async (e) => {
        e.preventDefault();
        if (!authForm.email || !authForm.email.includes("@")) {
          notify("সঠিক জিমেইল ঠিকানা দিন!");
          return;
        }
        setIsAuthLoading(true);
        try {
          const emailName = authForm.name.trim() || authForm.email.split("@")[0];
          const custId = `google_${authForm.email.replace(/[^a-zA-Z0-9]/g, "_")}`;
          const custData = {
            id: custId,
            name: emailName,
            email: authForm.email.trim(),
            phone: authForm.phone ? normalizePhone(authForm.phone) : "",
            photoUrl: "",
            authProvider: "google",
            createdAt: new Date().toISOString()
          };
          await saveCustomerProfile(custData);
          notify(`🎉 স্বাগতম ${custData.name}! জিমেইল দিয়ে সরাসরি কানেক্ট হয়েছে!`);
          setIsAuthModalOpen(false);
          setAuthForm({ name: "", phone: "", email: "", password: "" });
        } finally {
          setIsAuthLoading(false);
        }
      };

      const handlePhoneAuthSubmit = async (e) => {
        e.preventDefault();
        const normPhone = normalizePhone(authForm.phone);
        if (!normPhone || normPhone.length < 10) {
          notify("সঠিক ১১ ডিজিটের মোবাইল নম্বর দিন!");
          return;
        }
        if (!authForm.password || authForm.password.length < 4) {
          notify("কমপক্ষে ৪ ডিজিটের পাসওয়ার্ড দিন!");
          return;
        }

        setIsAuthLoading(true);
        try {
          const custId = `phone_${normPhone}`;
          if (authMode === "signup") {
            if (!authForm.name.trim()) {
              notify("আপনার নাম আবশ্যক!");
              setIsAuthLoading(false);
              return;
            }
            const newCust = {
              id: custId,
              name: authForm.name.trim(),
              phone: normPhone,
              email: authForm.email.trim() || "",
              password: authForm.password,
              photoUrl: "",
              authProvider: "phone",
              createdAt: new Date().toISOString()
            };
            await saveCustomerProfile(newCust);
            notify(`🎉 একাউন্ট তৈরি সফল হয়েছে! স্বাগতম ${newCust.name}!`);
          } else {
            // Login
            const existing = getStored("customer_user", null);
            const custData = {
              id: custId,
              name: (existing && existing.phone === normPhone && existing.name) ? existing.name : (authForm.name.trim() || "সম্মানিত ক্রেতা"),
              phone: normPhone,
              email: authForm.email.trim() || (existing?.email || ""),
              photoUrl: sanitizePhotoUrl(existing?.photoUrl),
              authProvider: "phone",
              updatedAt: new Date().toISOString()
            };
            await saveCustomerProfile(custData);
            notify(`🎉 স্বাগতম ${custData.name}! লগইন সফল হয়েছে!`);
          }
          setIsAuthModalOpen(false);
          setAuthForm({ name: "", phone: "", email: "", password: "" });
        } finally {
          setIsAuthLoading(false);
        }
      };

      const handleCustomerLogout = () => {
        if (confirm("আপনি কি একাউন্ট থেকে লগআউট করতে চান?")) {
          if (typeof firebase !== "undefined" && firebase.auth) {
            try { firebase.auth().signOut(); } catch(e) {}
          }
          setCurrentUser(null);
          localStorage.removeItem("sajgoj_store_customer_user");
          setIsProfileModalOpen(false);
          notify("সফলভাবে লগআউট হয়েছে!");
        }
      };

      const handleCustomerPhotoUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        if (!file.type.startsWith("image/")) {
          notify("অনুগ্রহ করে একটি ছবি ফাইল নির্বাচন করুন!");
          return;
        }

        const reader = new FileReader();
        reader.onload = (uploadEvent) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const maxDimension = 320;
            let w = img.width;
            let h = img.height;
            if (w > maxDimension || h > maxDimension) {
              if (w > h) {
                h = Math.round((h * maxDimension) / w);
                w = maxDimension;
              } else {
                w = Math.round((w * maxDimension) / h);
                h = maxDimension;
              }
            }
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, w, h);
            const compressedUrl = canvas.toDataURL("image/jpeg", 0.85);

            setProfileForm(prev => ({ ...prev, photoUrl: compressedUrl }));
            if (currentUser) {
              const updated = { ...currentUser, photoUrl: compressedUrl };
              saveCustomerProfile(updated);
            }
            notify("প্রোফাইল ছবি সফলভাবে আপডেট হয়েছে! 📷✨");
          };
          img.src = uploadEvent.target.result;
        };
        reader.readAsDataURL(file);
      };

      const handleSaveProfileSettings = async (e) => {
        e.preventDefault();
        if (!profileForm.name.trim()) {
          notify("আপনার নাম আবশ্যক!");
          return;
        }
        if (!currentUser) return;
        const updated = {
          ...currentUser,
          name: profileForm.name.trim(),
          phone: profileForm.phone ? normalizePhone(profileForm.phone) : currentUser.phone,
          email: profileForm.email.trim(),
          photoUrl: profileForm.photoUrl || currentUser.photoUrl,
          district: profileForm.district || "Dhaka",
          thana: profileForm.thana.trim(),
          address: profileForm.address.trim(),
          updatedAt: new Date().toISOString()
        };
        await saveCustomerProfile(updated);
        notify("প্রোফাইল তথ্য ও ডেলিভারি ঠিকানা সফলভাবে সংরক্ষিত হয়েছে! ✅");
        setIsProfileModalOpen(false);
      };

      // Customer Loyalty & VIP Membership Helper Functions
      const normalizePhone = (phone) => {
        if (!phone) return "";
        let clean = String(phone).replace(/\D/g, "");
        if (clean.startsWith("880")) clean = clean.slice(2);
        else if (clean.startsWith("88")) clean = clean.slice(2);
        return clean;
      };

      const getLoyaltyTiers = (loyaltyObj) => {
        if (Array.isArray(loyaltyObj?.tiers) && loyaltyObj.tiers.length > 0) {
          return loyaltyObj.tiers;
        }
        if (loyaltyObj?.tiers && typeof loyaltyObj.tiers === "object") {
          const vals = Object.values(loyaltyObj.tiers);
          if (vals.length > 0) return vals;
        }
        return initialLoyaltyConfig.tiers;
      };

      const getCustomerLoyalty = (rawPhone) => {
        const phone = normalizePhone(rawPhone);
        const rawTiersList = getLoyaltyTiers(loyalty);
        const tiers = [...rawTiersList].sort((a,b) => (Number(a.minSpend) || 0) - (Number(b.minSpend) || 0));
        const defaultTier = tiers[0] || initialLoyaltyConfig.tiers[0];

        if (!phone || phone.length < 10) {
          return {
            phone: rawPhone || "",
            customerName: "",
            totalSpend: 0,
            orderCount: 0,
            earnedPoints: 0,
            redeemedPoints: 0,
            manualPoints: 0,
            availablePoints: 0,
            currentTier: defaultTier,
            nextTier: tiers[1] || null,
            spendNeeded: tiers[1] ? Math.max(0, tiers[1].minSpend) : 0,
            progressPercent: 0
          };
        }

        const custOrders = (orders || []).filter(o => {
          const oPhone = normalizePhone(o.phone || o.customerPhone);
          return oPhone === phone && o.status !== "Cancelled";
        });

        const totalSpend = custOrders.reduce((sum, o) => sum + (Number(o.total) || 0), 0);
        const orderCount = custOrders.length;

        let recordedEarned = 0;
        let recordedRedeemed = 0;
        custOrders.forEach(o => {
          if (o.pointsEarned !== undefined && o.pointsEarned !== null) {
            recordedEarned += Number(o.pointsEarned) || 0;
          } else {
            const spendRate = Number(loyalty?.spendPerPoint) || 10;
            recordedEarned += Math.floor((Number(o.subtotal || o.total) || 0) / spendRate);
          }
          if (o.pointsRedeemed !== undefined && o.pointsRedeemed !== null) {
            recordedRedeemed += Number(o.pointsRedeemed) || 0;
          }
        });

        const manualAdj = Number(loyaltyCustomerMap?.[phone]?.manualPoints) || 0;
        const availablePoints = Math.max(0, recordedEarned - recordedRedeemed + manualAdj);

        let currentTier = defaultTier;
        let nextTier = null;

        for (let i = tiers.length - 1; i >= 0; i--) {
          if (totalSpend >= (Number(tiers[i].minSpend) || 0)) {
            currentTier = tiers[i];
            nextTier = tiers[i + 1] || null;
            break;
          }
        }

        let spendNeeded = 0;
        let progressPercent = 100;
        if (nextTier) {
          const range = (Number(nextTier.minSpend) || 0) - (Number(currentTier.minSpend) || 0);
          const currentProgress = totalSpend - (Number(currentTier.minSpend) || 0);
          spendNeeded = Math.max(0, (Number(nextTier.minSpend) || 0) - totalSpend);
          progressPercent = range > 0 ? Math.min(100, Math.max(0, Math.round((currentProgress / range) * 100))) : 100;
        }

        return {
          phone,
          customerName: custOrders[0]?.customer || custOrders[0]?.customerName || "",
          totalSpend,
          orderCount,
          earnedPoints: recordedEarned,
          redeemedPoints: recordedRedeemed,
          manualPoints: manualAdj,
          availablePoints,
          currentTier,
          nextTier,
          spendNeeded,
          progressPercent
        };
      };

      // Cart Functions
      const addToCart = (product, qty = 1, selectedColor = null, selectedSize = null) => {
        if (product.stock <= 0) {
          notify("দুঃখিত, এই পণ্যটি স্টক আউট!");
          return;
        }
        const color = selectedColor !== null && selectedColor !== undefined ? selectedColor : (selectedProductColor || (product.colors && product.colors[0]) || "");
        const size = selectedSize !== null && selectedSize !== undefined ? selectedSize : (selectedProductSize || (product.sizes && product.sizes[0]) || "");
        const cartItemId = `${product.id}_${color}_${size}`;

        setCart(prev => {
          const existing = prev.find(item => (item.cartItemId === cartItemId || (item.id === product.id && (item.selectedColor || "") === color && (item.selectedSize || "") === size)) && !item.isFreeGift);
          if (existing) {
            return prev.map(item => (item === existing) ? { 
              ...item, 
              qty: item.qty + qty, 
              bogo: Boolean(product.bogo), 
              bogoText: product.bogoText || "" 
            } : item);
          }
          return [...prev, { 
            ...product, 
            cartItemId,
            selectedColor: color,
            selectedSize: size,
            qty, 
            bogo: Boolean(product.bogo), 
            bogoText: product.bogoText || "" 
          }];
        });

        const variantParts = [color ? `রং: ${color}` : "", size ? `সাইজ: ${size}` : ""].filter(Boolean);
        const variantSuffix = variantParts.length > 0 ? ` (${variantParts.join(", ")})` : "";

        if (product.bogo) {
          notify(`🎉 "${product.name}"${variantSuffix} কার্টে যুক্ত হয়েছে! [🎁 Buy 1 Get 1 Free অফারে সাথে আরও ${qty}টি সম্পূর্ণ ফ্রি পাবেন!]`);
        } else {
          notify(`"${product.name}"${variantSuffix} কার্টে যুক্ত হয়েছে! 🛒`);
        }
      };

      const updateCartQty = (idOrCartItemId, delta) => {
        setCart(prev => prev.map(item => {
          const key = item.cartItemId || item.id;
          if (key === idOrCartItemId || item.id === idOrCartItemId) {
            if (item.isFreeGift) {
              if (delta < 0) return null;
              return item;
            }
            const newQty = item.qty + delta;
            return newQty > 0 ? { ...item, qty: newQty } : null;
          }
          return item;
        }).filter(Boolean));
      };

      // Automatic Buy 2 Get 1 Free (B2G1) Gift Synchronization in Cart
      useEffect(() => {
        const isB2g1Active = Boolean(config?.b2g1?.enabled);
        const minRequired = Number(config?.b2g1?.minItems) || 2;
        const freeProdId = config?.b2g1?.freeProductId || "p4";
        const freeProd = products.find(p => p.id === freeProdId);

        const paidItems = cart.filter(it => !it.isFreeGift);
        const totalPaidQty = paidItems.reduce((sum, it) => sum + (it.qty || 1), 0);
        const existingGift = cart.find(it => it.isFreeGift);

        if (isB2g1Active && freeProd && totalPaidQty >= minRequired) {
          if (!existingGift || existingGift.freeGiftOriginId !== freeProd.id) {
            const freeGiftItem = {
              id: "free_gift_" + freeProd.id,
              name: freeProd.name,
              price: 0,
              originalPrice: freeProd.price,
              qty: 1,
              images: freeProd.images || [imgBracelet],
              sku: freeProd.sku || "GIFT-FREE",
              isFreeGift: true,
              freeGiftOriginId: freeProd.id,
              bogo: false,
              sourceUrl: ""
            };
            setCart(prev => [...prev.filter(it => !it.isFreeGift), freeGiftItem]);
          }
        } else if ((!isB2g1Active || totalPaidQty < minRequired || !freeProd) && existingGift) {
          setCart(prev => prev.filter(it => !it.isFreeGift));
        }
      }, [cart, config?.b2g1, products]);

      const paidCartQty = cart.filter(item => !item.isFreeGift).reduce((sum, item) => sum + (item.qty || 1), 0);
      const cartSubtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      const isDhaka = checkoutForm.district.includes("ঢাকা") || checkoutForm.district.includes("Dhaka");
      const freeThreshold = (config.freeDeliveryThreshold !== "" && config.freeDeliveryThreshold !== undefined) ? Number(config.freeDeliveryThreshold) : 2000;
      const insideDhakaFee = (config.deliveryInsideDhaka !== "" && config.deliveryInsideDhaka !== undefined) ? Number(config.deliveryInsideDhaka) : 60;
      const outsideDhakaFee = (config.deliveryOutsideDhaka !== "" && config.deliveryOutsideDhaka !== undefined) ? Number(config.deliveryOutsideDhaka) : 120;
      const deliveryCharge = cartSubtotal >= freeThreshold ? 0 : (isDhaka ? insideDhakaFee : outsideDhakaFee);

      let discountAmount = 0;
      if (appliedCoupon) {
        if (appliedCoupon.type === "%") {
          discountAmount = Math.round((cartSubtotal * appliedCoupon.value) / 100);
        } else {
          discountAmount = appliedCoupon.value;
        }
      }

      // Member Tier & Loyalty Discount Computation
      const detectedLoyalty = getCustomerLoyalty(checkoutForm.phone);
      const isLoyaltyEnabled = Boolean(loyalty?.enabled);
      const customerTier = detectedLoyalty.currentTier;
      const tierDiscountPercent = isLoyaltyEnabled ? (Number(customerTier.discountPercent) || 0) : 0;
      const tierDiscountAmount = tierDiscountPercent > 0 ? Math.round((cartSubtotal * tierDiscountPercent) / 100) : 0;

      // Points Redemption Computation (100 points = 1 Taka by default)
      const pointsConversionRate = Number(loyalty?.pointsRate) || 100;
      const maxRedeemLimitPercent = Number(loyalty?.maxRedeemPercent) || 50;
      const minPointsNeeded = Number(loyalty?.minRedeemPoints) || 100;
      const maxPointsRedeemableInTaka = Math.floor((cartSubtotal * maxRedeemLimitPercent) / 100);
      const customerPointsInTaka = Math.floor((detectedLoyalty.availablePoints || 0) / pointsConversionRate);
      
      const canRedeemPoints = isLoyaltyEnabled && (detectedLoyalty.availablePoints || 0) >= minPointsNeeded && customerPointsInTaka > 0;
      const pointsDiscountAmount = (canRedeemPoints && redeemPointsChecked) 
        ? Math.min(customerPointsInTaka, maxPointsRedeemableInTaka) 
        : 0;
      const pointsRedeemedCount = pointsDiscountAmount * pointsConversionRate;

      // Points to be earned on this order
      const spendPerPointRate = Number(loyalty?.spendPerPoint) || 10;
      const pointsEarnedThisOrder = isLoyaltyEnabled ? Math.floor(cartSubtotal / spendPerPointRate) : 0;

      const totalDiscounts = discountAmount + tierDiscountAmount + pointsDiscountAmount;
      const giftWrapFee = isGiftWrap ? 50 : 0;
      const cartGrandTotal = Math.max(0, cartSubtotal - totalDiscounts) + deliveryCharge + giftWrapFee;

      // Apply Coupon
      const handleApplyCoupon = () => {
        const found = coupons.find(c => c.code.toUpperCase() === couponInput.trim().toUpperCase() && c.active);
        if (!found) {
          notify("ভুল বা মেয়াদোত্তীর্ণ কুপন কোড!");
          return;
        }
        if (cartSubtotal < found.minOrder) {
          notify(`এই কুপন ব্যবহারের জন্য ন্যূনতম ${found.minOrder} ৳ এর অর্ডার প্রয়োজন!`);
          return;
        }
        setAppliedCoupon(found);
        notify(`🎉 কুপন "${found.code}" কার্যকর হয়েছে!`);
      };

      // Place Order
      const handlePlaceOrder = (e) => {
        e.preventDefault();
        if (!checkoutForm.name || !checkoutForm.phone || !checkoutForm.address) {
          notify("অনুগ্রহ করে নাম, মোবাইল নম্বর এবং ঠিকানা পূরণ করুন!");
          return;
        }
        if (cart.length === 0) {
          notify("আপনার কার্ট খালি!");
          return;
        }

        const newOrderId = "ORD-" + Math.floor(1000 + Math.random() * 9000);
        const trimmedNote = (checkoutForm.orderNote || "").trim();
        const orderData = {
          id: newOrderId,
          customer: checkoutForm.name,
          phone: checkoutForm.phone,
          district: checkoutForm.district,
          thana: checkoutForm.thana || "সদর",
          address: checkoutForm.address,
          orderNote: trimmedNote,
          note: trimmedNote,
          giftWrap: isGiftWrap,
          giftWrapFee: giftWrapFee,
          giftMessage: isGiftWrap ? giftMessage.trim() : "",
          giftRecipient: isGiftWrap ? giftRecipient.trim() : "",
          giftSender: isGiftWrap ? giftSender.trim() : "",
          total: cartGrandTotal,
          subtotal: cartSubtotal,
          discount: totalDiscounts,
          couponDiscount: discountAmount,
          couponCode: appliedCoupon ? appliedCoupon.code : "",
          memberTier: customerTier.name,
          memberTierBn: customerTier.nameBn,
          tierDiscountPercent: tierDiscountPercent,
          tierDiscount: tierDiscountAmount,
          pointsRedeemed: pointsRedeemedCount,
          pointsDiscount: pointsDiscountAmount,
          pointsEarned: pointsEarnedThisOrder,
          deliveryCharge,
          paymentMethod: checkoutForm.paymentMethod,
          status: "Pending",
          date: new Date().toISOString().split("T")[0],
          items: cart.map(i => ({ 
            productId: i.id, 
            name: i.name, 
            qty: i.qty, 
            price: i.price, 
            image: i.images?.[0],
            sourceUrl: i.sourceUrl || "",
            isCombo: Boolean(i.isCombo),
            bundledProducts: i.bundledProducts || [],
            bogo: Boolean(i.bogo),
            bogoText: i.bogoText || "",
            isFreeGift: Boolean(i.isFreeGift),
            freeGiftOriginId: i.freeGiftOriginId || "",
            color: i.selectedColor || "",
            size: i.selectedSize || "",
            selectedColor: i.selectedColor || "",
            selectedSize: i.selectedSize || ""
          })),
          trackingId: ""
        };

        // Deduct stock (including for free gift)
        setProducts(prev => prev.map(p => {
          const inCart = cart.find(c => c.id === p.id || (c.isFreeGift && c.freeGiftOriginId === p.id));
          const deductQty = inCart ? (inCart.qty || 1) : 0;
          const updatedP = deductQty > 0 ? { ...p, stock: Math.max(0, p.stock - deductQty) } : p;
          if (deductQty > 0) syncDocToCloud("products", p.id, updatedP);
          return updatedP;
        }));

        setOrders(prev => [orderData, ...prev]);
        syncDocToCloud("orders", newOrderId, orderData);

        setCart([]);
        setIsCheckoutOpen(false);
        setIsCartOpen(false);
        setAppliedCoupon(null);
        setCouponInput("");
        setRedeemPointsChecked(false);
        setIsGiftWrap(false);
        setGiftMessage("");
        setGiftRecipient("");
        setGiftSender("");
        setCheckoutForm(prev => ({ ...prev, orderNote: "" }));
        notify(`ধন্যবাদ ${checkoutForm.name}! আপনার অর্ডার সফল হয়েছে (ID: #${newOrderId}) 🎉`);
      };

      // Courier Dispatch
      const dispatchCourier = (orderId, provider) => {
        const prefix = provider === "Steadfast" ? "ST-" : "PTH-" ;
        const tracking = prefix + Math.floor(100000 + Math.random() * 900000);
        setOrders(prev => prev.map(o => o.id === orderId ? { ...o, status: "Shipped", trackingId: tracking } : o));
        syncDocToCloud("orders", orderId, { status: "Shipped", trackingId: tracking });
        notify(`অর্ডার #${orderId} সফলভাবে ${provider}-এ বুকিং করা হয়েছে! ট্র্যাকিং ID: ${tracking}`);
      };

      // Change Order Status
      const updateOrderStatus = (orderId, newStatus) => {
        setOrders(prev => prev.map(o => o.id === orderId ? { ...o, status: newStatus } : o));
        syncDocToCloud("orders", orderId, { status: newStatus });
        notify(`অর্ডার #${orderId} এর স্ট্যাটাস "${newStatus}" করা হয়েছে! ✅`);

      const compressImage = (file, maxWidth = 800, maxHeight = 800, quality = 0.72) => {
        return new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
              const canvas = document.createElement("canvas");
              let width = img.width;
              let height = img.height;

              if (width > height) {
                if (width > maxWidth) {
                  height = Math.round((height * maxWidth) / width);
                  width = maxWidth;
                }
              } else {
                if (height > maxHeight) {
                  width = Math.round((width * maxHeight) / height);
                  height = maxHeight;
                }
              }

              canvas.width = Math.max(1, width);
              canvas.height = Math.max(1, height);
              const ctx = canvas.getContext("2d");
              ctx.drawImage(img, 0, 0, width, height);

              // Use WebP with quality 0.72 or JPEG fallback
              let dataUrl = canvas.toDataURL("image/webp", quality);
              if (!dataUrl || !dataUrl.startsWith("data:image/webp")) {
                dataUrl = canvas.toDataURL("image/jpeg", quality);
              }
              resolve(dataUrl);
            };
            img.onerror = () => resolve(e.target.result);
            img.src = e.target.result;
          };
          reader.onerror = () => resolve(null);
          reader.readAsDataURL(file);
        });

          const num = parseInt(clean, 16);
          const amt = Math.round(2.55 * percent);
          const r = Math.max(0, (num >> 16) - amt);
          const g = Math.max(0, ((num >> 8) & 0x00FF) - amt);
          const b = Math.max(0, (num & 0x0000FF) - amt);
          return "#" + (0x1000000 + r * 0x10000 + g * 0x100 + b).toString(16).slice(1);

                        const y1 = cy + r * Math.sin(rad1);

                        const pathData = `M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 0 1 ${x2} ${y2} Z`;

                        const textRad = (midAngle - 90) * (Math.PI / 180);
                        const tx = cx + 85 * Math.cos(textRad);
                        const ty = cy + 85 * Math.sin(textRad);

                              transform={`rotate(${midAngle}, ${tx}, ${ty})`}

                            </text>

                    </div>

                    <div>
                      <label className="text-xs font-semibold text-gray-700">অফার ব্যাজ</label>
                      <input
                        type="text"
                        placeholder="যেমন: সেরা পছন্দ 🔥"
                        value={reelForm.badge}
                        onChange={(e) => setReelForm({ ...reelForm, badge: e.target.value })}
                        className="w-full bg-[#fffaf5] border rounded-full px-4 py-2 text-xs outline-none mt-1"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="text-xs font-semibold text-gray-700">ক্যাপশন / বিবরণ</label>
                    <textarea
                      rows="2"
                      placeholder="ভিডিও সম্পর্কে সংক্ষিপ্ত বিবরণ লিখুন..."
                      value={reelForm.caption}
                      onChange={(e) => setReelForm({ ...reelForm, caption: e.target.value })}
                      className="w-full bg-[#fffaf5] border rounded-2xl p-3 text-xs outline-none mt-1 focus:border-[#7a1c2b]"
                    />
                  </div>

                  <button
                    onClick={handleAddReel}
                    className="w-full bg-[#7a1c2b] text-white py-3 rounded-full font-bold text-xs shadow hover:bg-[#681727] transition"
                  >
                    রিলস পাবলিশ করুন ✓
                  </button>
                </div>
              </div>
            </div>
          )}
          <a 
            href={`https://wa.me/${config.whatsapp}?text=Hello%20SAJGOJ%20FASHION,%20I%20want%20to%20order`} 
            target="_blank" 
            rel="noopener noreferrer" 
            className="fixed bottom-6 right-6 z-40 w-14 h-14 rounded-full bg-[#25D366] text-white flex items-center justify-center shadow-2xl border-2 border-white hover:scale-110 transition duration-300"
            title="WhatsApp Helpline"
          >
            <span className="text-2xl font-bold">💬</span>
          </a>

          {/* Toast Notification */}
          {toast && (
            <div className="fixed bottom-20 left-1/2 -translate-x-1/2 z-50 bg-[#2c1810] text-[#fff8f0] px-6 py-3 rounded-full text-xs sm:text-sm font-semibold shadow-2xl border border-[#d4a574] animate-fadeIn">
              {toast}
            </div>
          )}

          </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><App /></ErrorBoundary>);
  </script>
</body>
</html>
